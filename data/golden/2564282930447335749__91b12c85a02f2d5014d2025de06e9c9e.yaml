notes: "La Clotenca printed paper menu, reverse side (Burgers, Entrepans, Amanides, Pastes, Dolcos), photo rotated 90 degrees; Catalan; legible. Subtitles (e.g. 'VEGANA', 'THE ONE AND ONLY', 'MAMMA MIA') treated as taglines, not aliases. Pastes is a 'pasta combo': the priced 'Salses' (Pommodoro, Pisto, Pesto, Trufa, Brooklin) are labeled as the orderable dishes; pasta shapes (Tallarins healthy, Spaguettis, Tortiglione) are choices, not dishes. 'PESTO' first letters washed out by glare (reconstructed from '..STO' + 'Salsa de pesto fresc'), flag for review. Excluded: 'Clotenca Surprise' (weekly surprise, no concrete dish), Toppings Burgers list, beer pairings."
