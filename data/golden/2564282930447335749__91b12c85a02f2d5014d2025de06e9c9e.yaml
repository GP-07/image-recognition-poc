notes: "La Clotenca printed paper menu, reverse side (Burgers, Entrepans, Amanides, Pastes, Dolcos), photo rotated 90 degrees; Catalan; legible. Subtitles (e.g. 'VEGANA', 'THE ONE AND ONLY', 'MAMMA MIA') treated as taglines, not aliases. Pastes is a 'pasta combo': the priced 'Salses' (Pommodoro, Pisto, Pesto, Trufa, Brooklin) are labeled as the orderable dishes; pasta shapes without price (Spaguettis, Tortiglione) are choices, not items. 'PESTO' first letters washed out by glare (reconstructed from '..STO' + 'Salsa de pesto fresc'), flag for review. [v2 all-orderable-items policy] ADDED: 5 beers from the pairing boxes (NEGRA MODELO, BUDWEISER, LEFFE, STELLA ARTOIS, CORONITA); the 15 'Toppings Burgers' (+0,50 EUR each, names as printed); priced add-ons 'TALLARINS HEALTHY' (+0,60 EUR pasta upgrade) and 'NUTELLA VEGANA' (+1 EUR); 'CLOTENCA SURPRISE' (named weekly pasta, 7,90 EUR - uncertain, its content changes every week)."
