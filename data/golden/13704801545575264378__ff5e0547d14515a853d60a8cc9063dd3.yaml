notes: "Decoded pixels identical to 594bd6c7... (same photo saved twice), so the labels are identical. Veg World India vertical menu board in a wooden frame on the street, trilingual (Catalan/Spanish/English); small text but legible at full resolution. Sub-lines under each dish are mostly descriptions; they were added as aliases only when they are a direct translation of the dish name (e.g. Naan -> Pa/Pan/Bread, Mango Kulfi -> Helado de mango) - reviewer should check this judgment. Set menus (Thali, Menu Degustacion N1/N2, Menu Infantil) are listed as one item each; their component lines (which repeat a la carte dishes) are not listed separately. Excluded: hot drinks (Yogi tea, Chai, Tulsi tea, coffees, infusions), natural juices, lassis (bottom, partly cut). Spellings kept as printed ('Chilli Panner', 'Panner Tikka Dosa')."
