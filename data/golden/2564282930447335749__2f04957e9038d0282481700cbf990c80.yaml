notes: "La Clotenca (Barcelona) printed paper menu, pizza side, photo rotated 90 degrees; Catalan. Sections Pizzes Classic, Pizzes Healthy, Cosetes Bones. Each pizza has a playful subtitle (e.g. 'O SOLE MIO', 'LA DE LA CASA') - treated as tagline, not alias; reviewer may want them as aliases. 'CALABAZA' (Pumpkin Passion) is partly washed out by glare but reconstructible from visible letters - included, flag for review. Les Cassoletes listed as three dishes (header + variant). Excluded: 'De Temporada - pregunta'ns!' (no concrete dish), Pa d'all price variants (amb formatge / amb brie i tofona negra) folded into one item, offers 'Ofertes Clotenques', size/dough tables, beer promos."
