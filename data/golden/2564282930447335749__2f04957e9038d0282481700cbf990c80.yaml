notes: "La Clotenca (Barcelona) printed paper menu, pizza side, photo rotated 90 degrees; Catalan. Sections Pizzes Classic, Pizzes Healthy, Cosetes Bones. Each pizza has a playful subtitle (e.g. 'O SOLE MIO', 'LA DE LA CASA') - treated as tagline, not alias; reviewer may want them as aliases. 'CALABAZA' (Pumpkin Passion) is partly washed out by glare but reconstructible from visible letters - included, flag for review. Les Cassoletes listed as three dishes (header + variant). Excluded: 'De Temporada - pregunta'ns!' (no concrete dish), Pa d'all price variants (amb formatge / amb brie i tofona negra) folded into one item, size/dough tables. [v2 all-orderable-items policy] ADDED: beer 'PACIFICO' (pairing box 'Gaudeix-la amb Pacifico 2,5 EUR'); add-on 'MOZZA VEGETAL' (+1 EUR box 'Demana les pizzes classic amb mozza vegetal'); named offers 'OFERTA PIZZES CLASSIC' and 'OFERTA PIZZES HEALTHY'. Still left out: 'Dona-li flow a la pizza classic +1,50 EUR' (healthy-dough upgrade with only a slogan as name), healthy dough choices A/B, home delivery +1 EUR, Trufatta +1 EUR surcharge."
