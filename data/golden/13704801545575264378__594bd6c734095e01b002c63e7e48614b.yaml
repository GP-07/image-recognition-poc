notes: "Veg World India vertical menu board in a wooden frame on the street, trilingual (Catalan/Spanish/English); small text but legible at full resolution. Sub-lines under each dish are mostly descriptions; they were added as aliases only when they are a direct translation of the dish name (e.g. Naan -> Pa/Pan/Bread, Mango Kulfi -> Helado de mango) - reviewer should check this judgment. Set menus (Thali, Menu Degustacion N1/N2, Menu Infantil) are listed as one item each; their component lines (which repeat a la carte dishes) are not listed separately. Spellings kept as printed ('Chilli Panner', 'Panner Tikka Dosa'). [v2 all-orderable-items policy] ADDED: hot drinks (YOGI Tea, CHAI, Tulsi tea, Café, Cortado, Café con Leche, Té Verde con Menta Fresca; the line 'Poleo Menta, Tila, Manzanilla' split into three infusions); 8 natural juices with their Spanish/English name translations as aliases; 'Salted Lassi' with its Catalan/Spanish/English sub-lines as aliases (they are closer to descriptions - check). LEFT OUT: the second lassi line at the very bottom edge (cut off, unreadable)."
